# configurable LUT
fiftyfivenm_lcell_comb:
  weight: 100
  ports:
    dataa:   { dir: input }
    datab:   { dir: input }
    datac:   { dir: input }
    datad:   { dir: input }
    combout: { dir: output }
  params:
    lut_mask: { width: 16 }  # controls LUT logic
  resources: { lc: 1 }

# DFF
dffeas:
  weight: 100
  ports:
    q:   { dir: output, seq_inputs: [d] }
    clk: { dir: input, type: ext_clk }   # Intel: no clock buffer, ext_clk connected directly
    d:   { dir: input }
  resources: { lc: 1 }

# input buffer
fiftyfivenm_io_ibuf:
  weight: 0      # buffer-only: never randomly instantiated (a pin must drive exactly one ibuf)
  ports:
    i: { dir: input, type: ext_in }
    o: { dir: output }

  # output buffer
fiftyfivenm_io_obuf:
  weight: 100
  ports:
    i: { dir: input }
    o: { dir: output, type: ext_out }

# BRAM
ram_w1_a4:
  weight: 40
  ports:
    clk:  { dir: input, type: ext_clk }
    we:   { dir: input }
    addr: { dir: input,  width: 4 }
    din:  { dir: input,  width: 1 }
    dout: { dir: output, width: 1, seq_inputs: [addr, din, we] }
  resources: { m9k: 1 }

# DSP
dsp_w9:
  weight: 30
  ports:
    clk: { dir: input, type: ext_clk }
    a:   { dir: input,  width: 9 }
    b:   { dir: input,  width: 9 }
    out: { dir: output, width: 18, seq_inputs: [a, b] }
  resources: { dsp: 1 }